<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sonicBright" x1="10" y1="10" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sonicNavy" x1="12" y1="34" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243043"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sonicViolet" x1="40" y1="8" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- top fold (bright) -->
  <path d="M9 23 L36 9 L55 19 L28 33 Z" fill="url(#sonicBright)"/>
  <!-- violet corner accent on the top fold -->
  <path d="M44 14 L55 19 L48 27 L37 22 Z" fill="url(#sonicViolet)"/>
  <!-- bottom fold (navy), 180deg mirror of the top fold -->
  <path d="M55 41 L28 55 L9 45 L36 31 Z" fill="url(#sonicNavy)"/>
  <!-- center bridge connecting the two folds into an S ribbon -->
  <path d="M28 33 L36 31 L36 33 L28 35 Z" fill="#0b1220" opacity="0.35"/>
</svg>
