x-app-env: &app-env
  SONIC_DATABASE_URL: postgresql+asyncpg://sonic:sonic@postgres:5432/sonic
  SONIC_REDIS_URL: redis://redis:6379/0
  SONIC_SECRET_KEY: dev-secret-change-me
  SONIC_STORAGE_BACKEND: s3
  SONIC_S3_ENDPOINT_URL: http://minio:9000
  SONIC_S3_ACCESS_KEY: sonic
  SONIC_S3_SECRET_KEY: sonic-secret
  SONIC_S3_BUCKET: sonic-audio
  SONIC_LLM_PROVIDER: ollama
  SONIC_OLLAMA_BASE_URL: http://ollama:11434

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sonic
      POSTGRES_PASSWORD: sonic
      POSTGRES_DB: sonic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonic"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sonic
      MINIO_ROOT_PASSWORD: sonic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  ollamadata:
