[project]
name = "sonic-backend"
version = "0.1.0"
description = "Sonic API + AI pipeline services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29; platform_python_implementation == 'CPython'",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "anthropic>=0.40",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "PyYAML>=6.0",
    "email-validator>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy ML stages — each is feature-flagged with a cheap fallback when absent.
ml = [
    "banglaspeech2text>=1.0",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "speechbrain>=1.0",
    "spacy>=3.7",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Standard starter set: pyflakes, pycodestyle, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is enforced via formatter/line-length above, not worth failing builds over
    "UP042", # str+Enum -> StrEnum touches serialization behavior; revisit deliberately, not as a lint autofix
]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before importing app modules (settings are cached at import time).
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Scoped to the modules worth typing strictly for now; expand over time
# (see SON-33) rather than retrofitting the whole tree — e.g. app/pipeline
# has large, loosely-typed stage modules that would be noisy to fix upfront.
[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
