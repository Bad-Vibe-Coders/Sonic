name: Docker Compose Check

# Verifies backend/docker-compose.yml builds/starts cleanly, including the
# api and worker images (SON-40) -- not just the infra services. Catches:
# bad image tags, a broken Dockerfile, broken service config, a stack that
# never reaches healthy. Ollama is excluded: it reserves an nvidia GPU in
# compose, which GitHub-hosted runners don't have, so `docker compose up`
# would never consider it ready. The LLM stage (stage 6) already falls back
# to `skipped` when Ollama is unreachable, so the API/worker boot fine
# without it.
#
# SON-37 | Related: SON-21 (core CI), SON-40 (api/worker images this now covers), SON-1

on:
  push:
    branches: [main, staging]
    paths:
      - 'backend/docker-compose.yml'
      - 'backend/.env.example'
      - 'backend/Dockerfile'
      - 'backend/docker-entrypoint.sh'
      - '.github/workflows/docker-check.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'backend/docker-compose.yml'
      - 'backend/.env.example'
      - 'backend/Dockerfile'
      - 'backend/docker-entrypoint.sh'
      - '.github/workflows/docker-check.yml'

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack (minus Ollama)
        run: |
          docker compose up -d --build --wait --wait-timeout 180 postgres redis minio api worker

      - name: Smoke-test the API's /health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > response.json; then
              echo "API responded:"
              cat response.json
              break
            fi
            sleep 1
          done
          if ! grep -q '"status"' response.json 2>/dev/null; then
            echo "::error::API never responded on /api/v1/health"
            docker compose logs api
            exit 1
          fi
          if ! grep -q '"database": *true' response.json; then
            echo "::error::/health reported database: false -- Postgres wasn't actually reachable"
            cat response.json
            exit 1
          fi
          echo "✅ /api/v1/health returned 200 with database: true"

      - name: Confirm migrations actually ran (api applies them on boot)
        run: |
          docker compose exec -T postgres psql -U sonic -d sonic -c "\dt" | grep -q conversations \
            || { echo "::error::conversations table missing -- migrations didn't run"; exit 1; }

      - name: Confirm the worker container is healthy (not crash-looping)
        run: |
          status=$(docker compose ps worker --format '{{.State}}')
          echo "worker state: $status"
          [ "$status" = "running" ] || { echo "::error::worker container is not running"; docker compose logs worker; exit 1; }

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
