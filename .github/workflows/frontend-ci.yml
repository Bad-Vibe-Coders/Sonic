name: Frontend CI

# Lints, tests, and builds the frontend on every push/PR touching frontend/ so style
# drift, regressions, and broken builds are all caught early (see SON-34, SON-22).
# Deploy step intentionally omitted — add it once the hosting target is chosen.

on:
  push:
    branches: [main, staging]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main, staging]
    paths: ['frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
