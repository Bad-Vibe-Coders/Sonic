name: CI

# Foundation CI: "does it pass" checks only. Backend runs the pytest suite;
# frontend's build-succeeds gate already lives in frontend-ci.yml (added
# alongside SON-34) so it isn't duplicated here. More specific quality gates
# (ruff/mypy, eslint, alembic checks) live in their own workflows —
# backend-lint.yml (SON-33), frontend-ci.yml's lint step (SON-34), and
# whatever SON-35/SON-36 add — kept separate so failures are easy to attribute.

on:
  push:
    branches: [main, staging]
    paths: ['backend/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main, staging]
    paths: ['backend/**', '.github/workflows/ci.yml']

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install .[dev]
      # tests/conftest.py points SONIC_DATABASE_URL at a throwaway sqlite
      # file and monkeypatches the Celery/Redis event bus, so no Postgres
      # or Redis service container is needed here.
      - run: pytest
