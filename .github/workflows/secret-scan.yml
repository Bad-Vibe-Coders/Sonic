name: Secret Scan (Gitleaks)

# Scans for accidentally committed secrets (API keys, passwords, tokens).
# Uses the gitleaks CLI directly (MIT-licensed, no org license required).
#
# Two jobs:
#   1. scan-diff  — fast per-commit scan on every push / PR (informational)
#   2. scan-full  — weekly full-history scan (catches anything that slipped through)
#
# SON-36 | Related: SON-20 (manual cleanup this automates going forward)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekly full-history scan — Monday 03:00 UTC
    - cron: '0 3 * * 1'

# Version pinned for reproducibility. Update periodically.
env:
  GITLEAKS_VERSION: '8.24.3'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Diff scan — runs on every push / PR
  # Only scans the latest commit(s) for speed.
  # ---------------------------------------------------------------------------
  scan-diff:
    if: github.event_name != 'schedule'
    name: Scan diff for secrets
    runs-on: ubuntu-latest
    # ⚠️ INFORMATIONAL MODE: set to true so the check doesn't block PRs yet.
    # Once confirmed stable (no false positives for ~1-2 weeks), change to false
    # and add this job as a required status check in repo Settings → Branches.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits to diff HEAD~1..HEAD

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan latest commit diff
        run: |
          gitleaks detect \
            --source . \
            --log-opts="HEAD~1..HEAD" \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --verbose

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-diff-report
          path: gitleaks-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: Full-history scan — runs weekly on schedule
  # Catches secrets that may have been committed in older history.
  # ---------------------------------------------------------------------------
  scan-full:
    if: github.event_name == 'schedule'
    name: Full history secret scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full clone for complete history scan

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan full repository history
        run: |
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks-full-results.sarif \
            --verbose

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-report
          path: gitleaks-full-results.sarif
          retention-days: 90
